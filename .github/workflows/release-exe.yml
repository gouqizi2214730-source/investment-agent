name: Build and Release Windows EXE

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync upstream repository
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code https://github.com/bojing951-hash/investment-agent.git HEAD >/dev/null 2>&1; then
            git remote add upstream https://github.com/bojing951-hash/investment-agent.git || git remote set-url upstream https://github.com/bojing951-hash/investment-agent.git
            git fetch upstream
            UPSTREAM_REF=$(git rev-parse --verify upstream/main 2>/dev/null || git rev-parse --verify upstream/master)
            mkdir -p /tmp/custom_backup/.github/workflows /tmp/custom_backup/installer /tmp/custom_backup/scripts
            for f in gui_app.py scripts/generate_icon.py llm_providers.py updater.py launcher.py data_sources.py installer/investment-agent.iss .github/workflows/release-exe.yml; do
              if [ -f "$f" ]; then
                cp "$f" "/tmp/custom_backup/$f"
              fi
            done
            git checkout "$UPSTREAM_REF" -- .
            for f in gui_app.py scripts/generate_icon.py llm_providers.py updater.py launcher.py data_sources.py installer/investment-agent.iss .github/workflows/release-exe.yml; do
              if [ -f "/tmp/custom_backup/$f" ]; then
                mkdir -p "$(dirname "$f")"
                cp "/tmp/custom_backup/$f" "$f"
              fi
            done
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "Sync upstream bojing951-hash/investment-agent [skip ci]"
              git push origin HEAD:main || true
            fi
          else
            echo "Upstream repo unavailable, continuing with current code."
          fi

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies and PyInstaller
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-workbench.txt ]; then pip install -r requirements-workbench.txt; fi
          pip install pyinstaller customtkinter PySide6 Pillow

      - name: Build InvestmentAgent-win64.exe
        shell: bash
        run: |
          python scripts/generate_icon.py
          pyinstaller --noconfirm --clean --onedir --name InvestmentAgent \
          --add-data "*.py;." \
            --noconsole --icon=assets/icon.ico --add-data "assets;assets" \
            --collect-all streamlit \
            --hidden-import llm_providers \
            --hidden-import updater \
            --paths . --paths scripts --collect-all customtkinter \
          --add-data "scripts;scripts" --add-data "config;config" --add-data "data;data" --add-data "docs;docs" --add-data "examples;examples" --add-data "audit;audit" --add-data "ops;ops" --add-data ".agents;.agents" \
          --hidden-import workbench_data --hidden-import gui_app --hidden-import data_sources --hidden-import ia_cli --hidden-import env_config --hidden-import view_verifier --hidden-import view_store --hidden-import view_plausibility --hidden-import research_map --hidden-import research_archive \
          launcher.py 
      - name: Self-test InvestmentAgent-win64.exe
        run: python -c "import os, subprocess, sys; r = subprocess.run([r'dist\InvestmentAgent\InvestmentAgent.exe', '--mode', 'self-test']); (print(open('self_test_error.log', encoding='utf-8', errors='replace').read()) if r.returncode != 0 and os.path.exists('self_test_error.log') else None); sys.exit(r.returncode)"
      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y }
          if (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") { $env:PATH += ";C:\Program Files (x86)\Inno Setup 6" }
          iscc installer/investment-agent.iss
          ls dist/InvestmentAgent-Setup-win64.exe
          
      - name: Release v0.30.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.30.0
          name: Investment Agent v0.30.0 (Modern PySide6 High-DPI GUI & Windows Setup Installer)
          files: |
            dist/InvestmentAgent-Setup-win64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
